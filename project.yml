name: FitJourney
options:
  developmentLanguage: pt-BR
  bundleIdPrefix: br.com.renatocorrea
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FitJourney:
    type: application
    platform: iOS
    sources: [FitJourney, Shared/WatchLink, Shared/WatchConnectivity, Shared/Health]
    dependencies:
      - target: FitJourneyWatch
        embed: true
    info:
      path: FitJourney/App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        # HKWorkoutSession no iPhone (iOS 26+) segue gravando com o app em segundo plano.
        UIBackgroundModes: [workout-processing]
        # Coach com servidor compatível na rede local (Ollama): HTTP só para endereços locais.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: FitJourney/App/FitJourney.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.renatocorrea.fitjourney
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: FitJourney
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSHealthShareUsageDescription: "O FitJourney lê frequência cardíaca, FC em repouso, treinos, energia ativa, passos e massa corporal para mostrar seus treinos e seu dia com os dados do Apple Watch e estimar a energia gasta."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "O FitJourney grava seus treinos e a energia ativa deles no app Saúde."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "O FitJourney usa fotos e vídeos da galeria para ilustrar exercícios."
        INFOPLIST_KEY_NSCameraUsageDescription: "O FitJourney usa a câmera para fotografar exercícios."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "O FitJourney acessa a rede local só se você configurar o Coach com um servidor de IA no seu computador (ex.: Ollama)."
        SWIFT_EMIT_LOC_STRINGS: YES
  FitJourneyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FitJourneyTests]
    dependencies:
      - target: FitJourney
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: br.com.renatocorrea.fitjourney.tests
  FitJourneyWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    # Regras puras do treino no Saúde (tipo, eventos, zonas) compiladas também no relógio (W3b).
    sources:
      - FitJourneyWatch
      - Shared/WatchLink
      - Shared/WatchConnectivity
      - Shared/Health
      - FitJourney/Domain/TrainingEnums.swift
      - FitJourney/Domain/HealthAnalysis.swift
      - FitJourney/Domain/HealthWorkoutType.swift
    info:
      path: FitJourneyWatch/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        WKApplication: true
        WKCompanionAppBundleIdentifier: br.com.renatocorrea.fitjourney
        # HKWorkoutSession do relógio segue rodando (e tocando hápticos) com o pulso abaixado.
        WKBackgroundModes: [workout-processing]
    entitlements:
      path: FitJourneyWatch/FitJourneyWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.renatocorrea.fitjourney.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: br.com.renatocorrea.fitjourney
        INFOPLIST_KEY_CFBundleDisplayName: FitJourney
        INFOPLIST_KEY_NSHealthShareUsageDescription: "O FitJourney lê frequência cardíaca e energia para mostrar suas métricas durante o treino."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "O FitJourney grava seus treinos no app Saúde."
        TARGETED_DEVICE_FAMILY: "4"
        SWIFT_EMIT_LOC_STRINGS: YES
  FitJourneyWatchTests:
    type: bundle.unit-test
    platform: watchOS
    deploymentTarget: "26.0"
    sources: [FitJourneyWatchTests]
    dependencies:
      - target: FitJourneyWatch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: br.com.renatocorrea.fitjourney.watchtests
schemes:
  FitJourneyWatch:
    build:
      targets:
        FitJourneyWatch: all
        FitJourneyWatchTests: [test]
    test:
      targets: [FitJourneyWatchTests]
      language: pt-BR
      region: BR
  FitJourney:
    build:
      targets:
        FitJourney: all
        FitJourneyTests: [test]
    test:
      targets: [FitJourneyTests]
      # Testes rodam na língua de desenvolvimento (pt-BR), independente do idioma do simulador.
      language: pt-BR
      region: BR
