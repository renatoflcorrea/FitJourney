name: FitJourney
options:
  developmentLanguage: pt-BR
  bundleIdPrefix: br.com.renatocorrea
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FitJourney:
    type: application
    platform: iOS
    sources: [FitJourney, Shared/WatchLink, Shared/WatchConnectivity, Shared/Health, Shared/LiveActivity]
    dependencies:
      - target: FitJourneyWatch
        embed: true
      # Atividade ao Vivo + Dynamic Island (P6.4).
      - target: FitJourneyWidgets
        embed: true
    info:
      path: FitJourney/App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        # HKWorkoutSession no iPhone (iOS 26+) segue gravando com o app em segundo plano.
        UIBackgroundModes: [workout-processing]
        # Coach com servidor compatível na rede local (Ollama): HTTP só para endereços locais.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Atividade ao Vivo da sessão (DESIGN_DIRECTION §4.14).
        NSSupportsLiveActivities: true
    entitlements:
      path: FitJourney/App/FitJourney.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.renatocorrea.fitjourney
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: FitRoute
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSHealthShareUsageDescription: "O FitRoute lê frequência cardíaca, FC em repouso, treinos, energia ativa, passos e massa corporal para mostrar seus treinos e seu dia com os dados do Apple Watch e estimar a energia gasta."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "O FitRoute grava seus treinos e a energia ativa deles no app Saúde."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "O FitRoute usa fotos e vídeos da galeria para ilustrar exercícios."
        INFOPLIST_KEY_NSCameraUsageDescription: "O FitRoute usa a câmera para fotografar exercícios."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "O FitRoute acessa a rede local só se você configurar o Coach com um servidor de IA no seu computador (ex.: Ollama)."
        SWIFT_EMIT_LOC_STRINGS: YES
  FitJourneyWidgets:
    type: app-extension
    platform: iOS
    # Atividade ao Vivo (ActivityKit/WidgetKit). Atributos e intents compartilhados com o app; os
    # tokens do DesignSystem entram como fontes (sem componentes de vidro), §4.14 "Para quem implementa".
    sources:
      - FitJourneyWidgets
      - Shared/LiveActivity
      - FitJourney/DesignSystem/Tokens/FJColor.swift
      - FitJourney/DesignSystem/Tokens/FJFont.swift
      - FitJourney/DesignSystem/Tokens/FJFormat.swift
      - FitJourney/DesignSystem/Tokens/FJLayout.swift
      # Mesmo catálogo de strings do app (textos da atividade e dos intents).
      - FitJourney/Localizable.xcstrings
    info:
      path: FitJourneyWidgets/Info.plist
      properties:
        CFBundleDisplayName: FitRoute
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.renatocorrea.fitjourney.widgets
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
  FitJourneyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FitJourneyTests]
    dependencies:
      - target: FitJourney
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: br.com.renatocorrea.fitjourney.tests
  FitJourneyWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    # Regras puras do treino no Saúde (tipo, eventos, zonas) compiladas também no relógio (W3b).
    sources:
      - FitJourneyWatch
      - Shared/WatchLink
      - Shared/WatchConnectivity
      - Shared/Health
      - FitJourney/Domain/TrainingEnums.swift
      - FitJourney/Domain/HealthAnalysis.swift
      - FitJourney/Domain/HealthWorkoutType.swift
    info:
      path: FitJourneyWatch/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        WKApplication: true
        WKCompanionAppBundleIdentifier: br.com.renatocorrea.fitjourney
        # HKWorkoutSession do relógio segue rodando (e tocando hápticos) com o pulso abaixado.
        WKBackgroundModes: [workout-processing]
    entitlements:
      path: FitJourneyWatch/FitJourneyWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.renatocorrea.fitjourney.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: br.com.renatocorrea.fitjourney
        INFOPLIST_KEY_CFBundleDisplayName: FitRoute
        INFOPLIST_KEY_NSHealthShareUsageDescription: "O FitRoute lê frequência cardíaca e energia para mostrar suas métricas durante o treino."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "O FitRoute grava seus treinos no app Saúde."
        TARGETED_DEVICE_FAMILY: "4"
        SWIFT_EMIT_LOC_STRINGS: YES
  FitJourneyWatchTests:
    type: bundle.unit-test
    platform: watchOS
    deploymentTarget: "26.0"
    sources: [FitJourneyWatchTests]
    dependencies:
      - target: FitJourneyWatch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: br.com.renatocorrea.fitjourney.watchtests
schemes:
  FitJourneyWatch:
    build:
      targets:
        FitJourneyWatch: all
        FitJourneyWatchTests: [test]
    test:
      targets: [FitJourneyWatchTests]
      language: pt-BR
      region: BR
  FitJourney:
    build:
      targets:
        FitJourney: all
        FitJourneyTests: [test]
    test:
      targets: [FitJourneyTests]
      # Testes rodam na língua de desenvolvimento (pt-BR), independente do idioma do simulador.
      language: pt-BR
      region: BR
